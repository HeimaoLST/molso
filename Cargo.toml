[package]
name = "molso"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local password manager and credential injection CLI for AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/HeimaoLST/molso"
keywords = ["password-manager", "ai-agents", "credentials", "secrets", "cli"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "molso"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
dirs = "6"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
